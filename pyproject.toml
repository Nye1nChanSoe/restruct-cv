[project]
name = "restruct-cv"
version = "0.2.0"
description = "Turn messy PDF, DOCX, and scanned resumes into consistent, explainable, versioned JSON"
readme = "README.md"
authors = [
    { name = "Nyein Chan Soe", email = "contact@nyeinchansoe.com" }
]
requires-python = ">=3.11"
keywords = ["resume", "cv", "parser", "ats", "applicant-tracking", "ocr", "pdf", "docx"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pillow>=11.0",
    "python-docx>=1.1",
    "pymupdf>=1.28.2",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://github.com/Nye1nChanSoe/restruct-cv"
Repository = "https://github.com/Nye1nChanSoe/restruct-cv"
Issues = "https://github.com/Nye1nChanSoe/restruct-cv/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]
# Only `tools/export_onnx.py` needs these, and only when the ONNX weights are
# regenerated. Keeping torch out of `dependencies` is the whole point of the
# ONNX run time, so nothing here may be imported from `src/`.
export = [
    "optimum>=2.1,<2.2",
    "optimum-onnx>=0.1",
    "onnx>=1.17",
    "transformers>=4.51.3,<4.58",
    "torch>=2.4",
]
[project.scripts]
restruct = "restruct.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "restruct"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
