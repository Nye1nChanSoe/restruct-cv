[project]
name = "restruct"
version = "0.1.0"
description = "Turn messy PDF, DOCX, and scanned resumes into consistent, explainable, versioned JSON"
readme = "README.md"
authors = [
    { name = "Nyein Chan Soe", email = "contact@nyeinchansoe.com" }
]
requires-python = ">=3.11"
keywords = ["resume", "cv", "parser", "ats", "applicant-tracking", "ocr", "pdf", "docx"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pillow>=11.0",
    "python-docx>=1.1",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "transformers>=4.51.3,<5.14.0",
]

[project.urls]
Homepage = "https://github.com/Nye1nChanSoe/restruct"
Repository = "https://github.com/Nye1nChanSoe/restruct"
Issues = "https://github.com/Nye1nChanSoe/restruct/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[project.scripts]
restruct = "restruct.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "restruct"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
