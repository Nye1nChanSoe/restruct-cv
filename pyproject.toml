[project]
name = "restruct"
version = "0.1.0"
description = "Explainable resume extraction from native and scanned PDFs"
readme = "README.md"
authors = [
    { name = "Nyein Chan Soe", email = "nyeinchansoe.business@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "transformers>=4.51.3,<5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
extractor-v1 = "extractor_v1:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "extractor_v1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
