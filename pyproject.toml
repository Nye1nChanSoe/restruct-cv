[project]
name = "restruct"
version = "0.1.0"
description = "Explainable and deterministic resume extraction from native, scanned PDFs and DOCX"
readme = "README.md"
authors = [
    { name = "Nyein Chan Soe", email = "contact@nyeinchansoe.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0",
    "python-docx>=1.1",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "transformers>=4.51.3,<5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[project.scripts]
restruct = "restruct.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "restruct"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
